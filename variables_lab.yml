---
- name: Learn Ansible Variables
  hosts: local
  gather_facts: false
  vars:
    deployment_env: development
    application_name: nginx
    application_port: 8080
  tasks:
    - name: Display application information
      ansible.builtin.debug:
        msg: "Deploying {{ application_name }} in {{ deployment_env }} on port {{ application_port }}"
    - name: Validate application environment
      ansible.builtin.assert:
        that:
          - deployment_env == "development"
        success_msg: Environment validation passed
        fail_msg: Invalid deployment environment
